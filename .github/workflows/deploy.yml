name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pages deploys queue; PR builds cancel superseded runs
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup GitHub Pages configuration
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Cache Eleventy image output
        uses: actions/cache@v4
        with:
          path: |
            .cache
            _site/img
          key: eleventy-img-${{ runner.os }}-${{ hashFiles('**/*.{jpg,jpeg,png,webp,avif,svg}') }}
          restore-keys: |
            eleventy-img-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build site (Images + Eleventy + Tailwind + Pagefind)
        run: npm run build
        env:
          NODE_ENV: production
          ELEVENTY_PATH_PREFIX: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4